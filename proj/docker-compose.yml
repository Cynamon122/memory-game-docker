version: '1.0'

services:
  database:
    container_name: Organizer_db
    image: mysql:8.4.0
    environment:
      - "MYSQL_ROOT_PASSWORD=mypass123"
    volumes:
      - ./sql-scripts:/docker-entrypoint-initdb.d
  phpmyadmin:
    container_name: Organizer_phpmyadmin
    image: phpmyadmin
    ports:
      - "8081:80"
    environment:
      - "MYSQL_ROOT_PASSWORD=mypass123"
      - "PMA_HOST=Organizer_db"
  backend-node:
      container_name: "Organizer_backend"
      depends_on:
        - database
      restart: unless-stopped
      build: ./back-app
      ports:
        - "8555:8081"
      environment:
        - "MYSQL_HOST=Organizer_db"
        - "MYSQL_PORT=3306"
        - "MYSQL_USER=root"
        - "MYSQL_PASSWORD=mypass123"
        - "MYSQL_DB=organizer_przepisow"
      # zakomentować obie linie volumes do wersji prod
      volumes:
        - ./back-app/src:/code/src  # Podpinamy katalog z kodem z hosta
  frontend-node:
    container_name: "Organizer_frontend"
    depends_on:
      - backend-node
    restart: unless-stopped
    build: ./front-app
    ports:
      - "8888:5173"
    volumes:
      - ./front-app:/home/node/app
      - /home/node/app/node_modules

